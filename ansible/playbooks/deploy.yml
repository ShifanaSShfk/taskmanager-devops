# ansible/playbooks/deploy.yml
# Lightweight deploy playbook — just pulls and restarts the new image.
# Run with: ansible-playbook -i inventory.ini playbooks/deploy.yml -e "docker_image=myuser/taskmanager-api:v1.2.0"

- name: Deploy new application version
  hosts: app_servers
  become: yes

  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Pull new Docker image
      ansible.builtin.command:
        cmd: "docker pull {{ docker_image }}"

    - name: Restart app with new image
      ansible.builtin.command:
        cmd: docker compose up -d --no-deps api
        chdir: "{{ app_dir }}"

    - name: Health check after deploy
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/health"
        status_code: 200
      retries: 10
      delay: 5
      until: result.status == 200
      register: result