# k8s/base/secret.yml
# Secrets are base64-encoded (NOT encrypted by default — but access-controlled).
# In production, use External Secrets Operator to pull from HashiCorp Vault.
#
# Generate base64 values:
#   echo -n "yourpassword" | base64

apiVersion: v1
kind: Secret
metadata:
  name: taskmanager-secrets
  namespace: taskmanager
type: Opaque
data:
  # echo -n "devpassword123" | base64
  DB_PASSWORD: ZGV2cGFzc3dvcmQxMjM=
  # echo -n "dev-jwt-secret-minimum-32-chars-long" | base64
  JWT_SECRET:  ZGV2LWp3dC1zZWNyZXQtbWluaW11bS0zMi1jaGFycy1sb25n