# .github/workflows/sonar.yml
# Runs SonarQube code quality analysis on every push.

name: SonarQube Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  sonarqube:
    name: SonarQube scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0             # SonarQube needs full git history

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Run tests and generate coverage report in LCOV format
      # SonarQube reads this to show coverage in its UI
      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=lcov
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-at-least-32-characters-long

      # Send the analysis to SonarCloud (free hosted SonarQube)
      # Sign up at sonarcloud.io — connect your GitHub repo
      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} 