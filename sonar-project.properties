# sonar-project.properties
# Configuration for SonarQube analysis

sonar.projectKey=taskmanager-devops
sonar.projectName=Task Manager API
sonar.projectVersion=1.0.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Tell SonarQube where the Jest coverage report is
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-reporter.xml

# Exclusions — don't analyse these
sonar.exclusions=node_modules/**,coverage/**,dist/**

# Quality gate thresholds
# These are set in the SonarQube UI, but documented here for reference:
# - Coverage on new code >= 70%
# - Duplicated lines on new code <= 3%
# - Maintainability rating = A
# - Reliability rating = A
# - Security rating = A