version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:18.0
      - image: cimg/postgres:15.0
        environment:
          POSTGRES_DB: taskmanager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
      - image: cimg/redis:7.0
    working_directory: ~/app

jobs:
  test:
    executor: node-executor

    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      - run:
          name: Wait for services
          command: |
            dockerize -wait tcp://localhost:5432 -timeout 60s
            dockerize -wait tcp://localhost:6379 -timeout 60s

      - run:
          name: Run tests
          command: npm test -- --ci --coverage
          environment:
            NODE_ENV: test
            DB_HOST: localhost
            DB_PORT: "5432"
            DB_NAME: taskmanager_test
            DB_USER: postgres
            DB_PASSWORD: testpassword
            REDIS_HOST: localhost
            REDIS_PORT: "6379"
            JWT_SECRET: circleci-test-secret-32-chars-minimum

      - store_artifacts:
          path: coverage

  build-and-push:
    docker:
      - image: cimg/node:18.0

    working_directory: ~/app

    steps:
      - checkout

      - setup_remote_docker:
          version: docker23

      - run:
          name: Docker login
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - run:
          name: Build Docker image
          command: |
            docker build \
              -t $DOCKERHUB_USERNAME/taskmanager-devops:latest .

      - run:
          name: Push Docker image
          command: |
            docker push $DOCKERHUB_USERNAME/taskmanager-devops:latest

workflows:
  build-test:
    jobs:
      - test

      - build-and-push:
          requires:
            - test
          filters:
            branches:
              only:
                - develop
                - main