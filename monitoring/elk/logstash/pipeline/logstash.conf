# monitoring/elk/logstash/pipeline/logstash.conf
# Logstash pipeline — input → filter → output
# Receives logs from Filebeat, parses them, sends to Elasticsearch

input {
  # Receive logs shipped by Filebeat
  beats {
    port => 5044
  }
}

filter {

  # Parse the JSON log format from our Node.js app (morgan outputs JSON)
  if [fields][app] == "taskmanager-api" {

    # Parse JSON log lines
    json {
      source => "message"
      target => "parsed"
    }

    # Extract fields from the parsed JSON
    if [parsed][method] {
      mutate {
        add_field => {
          "http_method"    => "%{[parsed][method]}"
          "http_url"       => "%{[parsed][url]}"
          "http_status"    => "%{[parsed][status]}"
          "response_time"  => "%{[parsed][responseTime]}"
        }
      }
    }

    # Convert response time to a number for sorting and aggregation
    mutate {
      convert => { "response_time" => "integer" }
    }

    # Tag slow requests automatically (over 500ms)
    if [response_time] and [response_time] > 500 {
      mutate {
        add_tag => ["slow_request"]
      }
    }

    # Tag error responses automatically
    if [http_status] and [http_status] >= 500 {
      mutate {
        add_tag => ["server_error"]
      }
    }

    # Parse the timestamp from the log entry
    date {
      match => ["[parsed][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Drop health check logs — too noisy, not useful
  if [http_url] == "/health" or [http_url] == "/metrics" {
    drop {}
  }

  # Add geo-location for IP addresses (useful for security analysis)
  if [parsed][remoteAddress] {
    geoip {
      source => "[parsed][remoteAddress]"
      target => "geoip"
    }
  }
}

output {
  # Send all logs to Elasticsearch
  elasticsearch {
    hosts    => ["elasticsearch:9200"]
    index    => "taskmanager-logs-%{+YYYY.MM.dd}"   # Daily indices
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }

  # Also print to stdout for debugging (remove in production)
  stdout {
    codec => rubydebug
  }
}