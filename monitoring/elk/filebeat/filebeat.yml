filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    fields:
      app: taskmanager
    fields_under_root: true

processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

output.logstash:
  hosts: ["logstash:5044"]

filebeat.config.reload.enabled: true
filebeat.config.reload.period: 10s

logging.level: info
