global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape our Node.js app
  # 'host.docker.internal' = your laptop's localhost from inside Docker
  - job_name: 'taskmanager-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['taskmanager-api:3000']
    relabel_configs:
      - target_label: app
        replacement: taskmanager-api

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
