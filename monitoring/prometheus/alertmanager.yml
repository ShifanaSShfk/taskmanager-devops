# monitoring/prometheus/alertmanager.yml
# Routes alerts to notification channels.

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait:      30s     # Wait 30s before sending first alert (groups duplicates)
  group_interval:  5m      # Wait 5m between alerts for same group
  repeat_interval: 12h     # Re-alert every 12h if still firing
  receiver: 'default'

  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true

  - name: 'critical-alerts'
    # In production — add Slack webhook here:
    # slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#alerts'
    #     title: 'CRITICAL: {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true
